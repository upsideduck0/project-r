<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project R</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0d14;
        color: #e6e6e6;

        pointer-events: none;
      }

  <body>
    <div id="game"></div>
    <div class="hint">
      A/D move &middot; Space jump &middot; Q/E dash &middot; W step up &middot; S drop through &middot;
      Right-click draw/sheathe &middot; Left-click attack (when drawn) &middot;
      1-0 hotbar &middot; Tab inventory
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
